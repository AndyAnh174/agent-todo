version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: agent_plan
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8000
      JWT_SECRET: change_me
      JWT_EXPIRES_MIN: 60
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/agent_plan
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:


