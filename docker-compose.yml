version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: agent_plan
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      APP_ENV: development
      APP_PORT: 8000
      JWT_SECRET: change_me
      JWT_EXPIRES_MIN: 60
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/agent_plan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OLLAMA_HOST: http://222.253.80.30:11434
      OLLAMA_MODEL: qwen3:4b
      BGE3_API_URL: https://embed.andyanh.id.vn/embed
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: todo_embeddings
    ports:
      - "8000:8000"

  celery-worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/agent_plan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OLLAMA_HOST: http://222.253.80.30:11434
      OLLAMA_MODEL: qwen3:4b
      BGE3_API_URL: https://embed.andyanh.id.vn/embed
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: todo_embeddings

  celery-beat:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/agent_plan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OLLAMA_HOST: http://222.253.80.30:11434
      OLLAMA_MODEL: qwen3:4b
      BGE3_API_URL: https://embed.andyanh.id.vn/embed
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: todo_embeddings

volumes:
  pgdata:
  redisdata:
  qdrantdata:


